<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code or 404 }} – PocketSmart AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="ambient-glow ambient-top-left"></div>
  <div class="ambient-glow ambient-bottom-right"></div>

  <div class="glass-panel p-5 text-center position-relative" style="max-width: 520px; z-index: 10;">
    <div class="display-1 fw-bold gradient-text mb-2">{{ code or 404 }}</div>
    <h3 class="text-white mb-3">Something Went Off Track</h3>
    <p class="text-secondary mb-4">{{ message or "The page or resource you requested could not be found." }}</p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary-smart">
        <i class="fas fa-home me-1"></i> Return to Dashboard
      </a>
      <a href="{{ url_for('index') }}" class="btn btn-outline-smart">
        Home
      </a>
    </div>
  </div>

</body>
</html>
