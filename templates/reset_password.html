<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – PocketSmart AI</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

  <div class="ambient-glow ambient-top-left"></div>
  <div class="ambient-glow ambient-bottom-right"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="{{ url_for('index') }}" class="text-decoration-none">
          <div class="auth-logo-badge">🔐</div>
          <h2 class="auth-title">Pocket<span class="gradient-text">Smart</span> AI</h2>
        </a>
        <h4 class="mt-2 text-white">Set New Password</h4>
        <p class="auth-subtitle">Please enter and confirm your new secure password.</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-custom alert-{{ category if category != 'danger' else 'danger' }}-custom">
              <i class="fas fa-exclamation-circle"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('reset_password', token=token) }}" method="POST" id="authForm">
        <div class="form-group-custom">
          <label class="form-label-custom" for="password">New Password (min 6 characters)</label>
          <div class="input-with-icon">
            <i class="fas fa-lock input-icon-left"></i>
            <input type="password" id="password" name="password" class="form-input-custom" placeholder="••••••••" required autofocus>
            <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group-custom">
          <label class="form-label-custom" for="confirm_password">Confirm New Password</label>
          <div class="input-with-icon">
            <i class="fas fa-shield-alt input-icon-left"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input-custom" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit mt-3">
          <i class="fas fa-check-circle"></i> Update Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="{{ url_for('login') }}">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
